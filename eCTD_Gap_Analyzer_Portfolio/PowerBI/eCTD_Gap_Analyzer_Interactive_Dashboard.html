<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#1b1f24;--mu:#5b6573;--bd:#d9dde3;--ac:#0b5cad;--ok:#1a7f37;--wa:#b26a00;--er:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",Arial,sans-serif}
header{background:#0a3560;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:19px;margin:0}header span{font-size:12px;color:#dbe8f7}
nav{display:flex;gap:4px;padding:10px 22px 0;flex-wrap:wrap}nav button{border:1px solid var(--bd);border-bottom:0;background:#e6eaf0;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}nav button.on{background:#fff;font-weight:600;color:var(--ac)}
main{background:#fff;margin:0 22px 22px;border:1px solid var(--bd);padding:16px;border-radius:0 8px 8px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:8px;padding:8px 12px}.k b{display:block;font-size:24px}.k span{font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.p{border:1px solid var(--bd);border-radius:8px;padding:12px}.p h3{margin:0 0 8px;font-size:14px}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.ctl label{font-size:12px;color:var(--mu)}select,input[type=range]{font:inherit}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:#0a3560;color:#fff;position:sticky;top:0}
.tw{overflow:auto;max-height:520px}.b{display:inline-block;padding:2px 9px;border-radius:10px;color:#fff;font-weight:600;font-size:11px}
.Missing,.Major{background:var(--er)}.Partial,.Minor{background:var(--wa)}.Compliant,.Ready{background:var(--ok)}
.lg span{display:inline-block;margin-right:12px;font-size:12px}.lg i{display:inline-block;width:11px;height:11px;margin-right:4px;border-radius:2px}
.note{font-size:12px;color:var(--mu);margin-top:10px}.hm td{text-align:center;font-weight:600;color:#fff;min-width:54px}
svg text{font-family:inherit}
</style></head><body>

  <div class="p"><h3>Compliance score by document</h3>${scoreBars()}</div></div>
  <div class="p" style="margin-top:12px"><h3>Document summary</h3><div class="tw"><table><tr><th>ID</th><th>Case</th><th>Authority</th><th>Section</th><th>Compliant</th><th>Partial</th><th>Missing</th><th>Score</th><th>Verdict</th><th>Gate</th></tr>
  ${DATA.docs.map(d=>{const s=docStats(d.id);return `<tr><td>${d.id}</td><td>${esc(d.title)}</td><td>${d.auth}</td><td>${d.sec}</td><td>${s.Compliant}</td><td>${s.Partial}</td><td>${s.Missing}</td><td>${s.s.toFixed(1)}%</td><td><span class="b ${VK[d.verdict]}">${d.verdict}</span></td><td>${s.pass?'PASS':'FAIL'}</td></tr>`}).join('')}</table></div></div>
  <p class="note">All data are synthetic. Score = (Compliant + 0.5 x Partial) / checks; gate passes at the chosen threshold with zero Missing.</p>`}
 if(page==1){const au=[...new Set(DATA.docs.map(d=>d.auth))],gl=[...new Set(DATA.findings.map(f=>f.guideline))].sort();
  const rows=DATA.findings.filter(f=>(!F.auth||DATA.docs.find(d=>d.id==f.doc).auth==F.auth)&&(!F.status||f.status==F.status)&&(!F.gl||f.guideline==F.gl));
  const sel=(k,l,o)=>`<label>${l} <select onchange="F.${k}=this.value;render()"><option value="">All</option>${o.map(x=>`<option ${F[k]==x?'selected':''}>${x}</option>`).join('')}</select></label>`;
  m.innerHTML=`<div class="ctl">${sel('auth','Authority',au)}${sel('status','Status',['Missing','Partial','Compliant'])}${sel('gl','Guideline',gl)}<b>${rows.length} rows</b></div>
  <div class="tw"><table><tr><th>Doc</th><th>Element</th><th>Guideline</th><th>Status</th><th>Reviewer risk</th><th>Corrective action</th></tr>${rows.map(f=>`<tr><td>${f.doc}</td><td>${esc(f.element)}</td><td>${f.guideline}</td><td><span class="b ${f.status}">${f.status}</span></td><td>${esc(f.risk)}</td><td>${esc(f.action)}</td></tr>`).join('')}</table></div>`}
 if(page==2){const auths=[...new Set(DATA.regional.map(r=>r.auth))];
  const cell=r=>{const sc=(r.C+.5*r.P)/r.n,bg=VC[r.verdict];return `<td style="background:${bg}" title="${r.verdict}: ${r.M} Missing, ${r.P} Partial">${(sc*100).toFixed(0)}%</td>`};
  m.innerHTML=`<h3>Compliance score by document and authority (colour = verdict)</h3><div class="tw"><table class="hm"><tr><th>Doc</th>${auths.map(a=>`<th>${a}</th>`).join('')}</tr>
  ${DATA.docs.map(d=>`<tr><td style="background:#eef1f5;color:#1b1f24">${d.id}</td>${auths.map(a=>cell(DATA.regional.find(r=>r.doc==d.id&&r.auth==a))).join('')}</tr>`).join('')}</table></div>
  <div class="lg" style="margin-top:8px">${Object.keys(VC).map(k=>`<span><i style="background:${VC[k]}"></i>${k}</span>`).join('')}</div>
  <p class="note">Authority changes results only through master-file (LOA / letter of access / registration) checks and the zone IVb stability check. Only D07 changes verdict across authorities.</p>`}
 if(page==3){const tp=DATA.defects.filter(x=>x.seeded&&x.detected).length,fn=DATA.defects.filter(x=>x.seeded&&!x.detected).length,fp=DATA.defects.filter(x=>!x.seeded&&x.detected).length;
  const g={};DATA.defects.forEach(x=>{const o=g[x.guideline]=g[x.guideline]||{s:0,d:0};o.s+=x.seeded;o.d+=x.detected});
  m.innerHTML=`<div class="kpis"><div class="k"><b>${tp}</b><span>True positives</span></div><div class="k"><b>${fp}</b><span>False positives</span></div><div class="k"><b>${fn}</b><span>False negatives</span></div>
  <div class="k"><b>${(tp/(tp+fp||1)*100).toFixed(0)}%</b><span>Precision</span></div><div class="k"><b>${(tp/(tp+fn||1)*100).toFixed(0)}%</b><span>Recall</span></div></div>
  <div class="tw"><table><tr><th>Guideline</th><th>Seeded</th><th>Detected</th></tr>${Object.keys(g).sort().map(k=>`<tr><td>${k}</td><td>${g[k].s}</td><td>${g[k].d}</td></tr>`).join('')}</table></div>
  <p class="note"><b>Limitation:</b> seeded defects were authored against the tool's own rules, so this is a regression test, not independent accuracy evidence.</p>`}}
render();
</script></body></html>
